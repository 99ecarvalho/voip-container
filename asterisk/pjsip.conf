; Minimal chan_pjsip config for the barebone test target.
; One transport, one endpoint/aor/auth for the barebone UA (user 1001 / pass test),
; G.711 only (matches the device: pcma/pcmu), no encryption, direct media off so
; Asterisk stays in the media path (needed for Echo/Milliwatt).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5060

; ---- the barebone device account ----
[1001]
type = endpoint
context = test
disallow = all
allow = ulaw
allow = alaw
auth = 1001
aors = 1001
direct_media = no
dtmf_mode = rfc4733
; allow unsolicited / no-registration calls too (handy for direct-IP testing)
identify_by = username,ip

[1001]
type = auth
auth_type = userpass
username = 1001
password = test

[1001]
type = aor
max_contacts = 2
remove_existing = yes

; ---- allow anonymous direct-IP calls (no registration) for quick tests ----
[anonymous]
type = endpoint
context = test
disallow = all
allow = ulaw
allow = alaw
direct_media = no
dtmf_mode = rfc4733

; ---- alternate DTMF mode variants ----

[1001-inband]
type = endpoint
context = test
disallow = all
allow = ulaw
allow = alaw
auth = 1001-inband
aors = 1001-inband
direct_media = no
dtmf_mode = inband
identify_by = username,ip

[1001-inband]
type = auth
auth_type = userpass
username = 1001-inband
password = test

[1001-inband]
type = aor
max_contacts = 2
remove_existing = yes

[1001-info]
type = endpoint
context = test
disallow = all
allow = ulaw
allow = alaw
auth = 1001-info
aors = 1001-info
direct_media = no
dtmf_mode = info
identify_by = username,ip

[1001-info]
type = auth
auth_type = userpass
username = 1001-info
password = test

[1001-info]
type = aor
max_contacts = 2
remove_existing = yes

[1001-auto]
type = endpoint
context = test
disallow = all
allow = ulaw
allow = alaw
auth = 1001-auto
aors = 1001-auto
direct_media = no
dtmf_mode = auto
identify_by = username,ip

[1001-auto]
type = auth
auth_type = userpass
username = 1001-auto
password = test

[1001-auto]
type = aor
max_contacts = 2
