; Dialplan for the barebone audio tests.
; Call sip:<ext>@<asterisk-host> where <ext> is one of the names below.

[general]
static = yes
writeprotect = no

[test]
; --- Echo test: your audio is looped straight back. ---
; Best for hearing ECHO and judging the AEC. If you hear yourself loud/clear and
; the level rides up and down, that's the echo/AEC behaviour you're chasing.
exten => echo,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()

; --- Milliwatt: continuous 1004 Hz tone at 0 dBm0 (the telecom reference). ---
; Best for VOLUME STABILITY / AGC / clicks: the source level is perfectly
; constant, so ANY level floating or clicks you hear/record are introduced by
; the device's audio chain (resampler, AEC/AGC, ALSA), not by the far end.
exten => milliwatt,1,Answer()
 same => n,Playback(silence/1)
 same => n,Milliwatt()
 same => n,Hangup()

; --- Reference dial/ring tones. ---
exten => tone,1,Answer()
 same => n,Playtones(dial)
 same => n,Wait(30)
 same => n,Hangup()

; --- Silence then a tone: test comfort-noise / silence gating (audio_silence). ---
exten => silence,1,Answer()
 same => n,Wait(5)
 same => n,Playtones(1004/1000)
 same => n,Wait(2)
 same => n,Hangup()

; --- Asterisk's classic talking clock / demo, useful for speech intelligibility.
exten => speak,1,Answer()
 same => n,Playback(demo-congrats)
 same => n,Wait(2)
 same => n,Hangup()

; Numeric aliases (some UAs dial digits more easily than names).
exten => 600,1,Goto(test,echo,1)      ; 600 = echo (Asterisk convention)
exten => 601,1,Goto(test,milliwatt,1)
exten => 602,1,Goto(test,tone,1)

; --- DTMF receive test: answers, waits for 4 digits, says them back. ---
; Useful for verifying that the UA is sending DTMF in the expected mode.
exten => dtmf-test,1,Answer()
 same => n,Wait(1)
 same => n,Read(DIGITS,beep,4,,,5)
 same => n,SayDigits(${DIGITS})
 same => n,Hangup()
exten => 603,1,Goto(test,dtmf-test,1)

; --- MixMonitor record+echo: records the mixed audio for sox analysis. ---
; /asterisk-tmp is /tmp/sip-test on the host; the webui lists it under Recordings.
; Useful for offline waveform / level / distortion analysis.
exten => record,1,Answer()
 same => n,MixMonitor(/asterisk-tmp/monitor-${UNIQUEID}.wav)
 same => n,Echo()
 same => n,Hangup()
exten => 604,1,Goto(test,record,1)

; --- Opus echo: same as echo but negotiates opus if the UA supports it. ---
exten => opus-echo,1,Answer()
 same => n,Wait(1)
 same => n,Echo()
 same => n,Hangup()
exten => 605,1,Goto(test,opus-echo,1)

; =============================================================================
; Telegärtner call-center simulation (AGI-driven)
; =============================================================================
; Device registers/calls as 1001 (or any account). After the VoIP call is
; established the barebone TG client drives the protocol exchange; the AGI on
; the Asterisk side plays the call-center role.
;
; Numeric aliases 700-703 included so devices that can only dial digits work.
;
; Usage:
;   sip:tg-real@<host>        real emergency (call-type 12)
;   sip:tg-tech@<host>        technician     (call-type 13)
;   sip:tg-routine@<host>     routine test   (call-type 14)
;   sip:tg-routine2@<host>    routine test   (call-type 22)

exten => tg-real,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(tg_callcenter.py,12)
 same => n,Hangup()

exten => tg-tech,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(tg_callcenter.py,13)
 same => n,Hangup()

exten => tg-routine,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(tg_callcenter.py,14)
 same => n,Hangup()

exten => tg-routine2,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(tg_callcenter.py,22)
 same => n,Hangup()

exten => 700,1,Goto(test,tg-real,1)
exten => 701,1,Goto(test,tg-tech,1)
exten => 702,1,Goto(test,tg-routine,1)
exten => 703,1,Goto(test,tg-routine2,1)

; =============================================================================
; P100 / EOX call-center simulation (AGI-driven)
; =============================================================================
; The P100 frame exchange happens on the ANALOG side (FXS ↔ 2N phone) before
; the VoIP call is placed.  These extensions simulate what the call center does
; OVER VOIP after the call is connected:
;
;   p100-real     — answer + send 'A' (acknowledge) + voice phase
;   p100-routine  — EOX routine-test handshake (N → N+1 → N+2)
;
; Numeric aliases 704-705.

exten => p100-real,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(p100_callcenter.py,real)
 same => n,Hangup()

exten => p100-routine,1,Answer()
 same => n,Wait(0.5)
 same => n,AGI(p100_callcenter.py,routine)
 same => n,Hangup()

exten => 704,1,Goto(test,p100-real,1)
exten => 705,1,Goto(test,p100-routine,1)

; --- Play uploaded WAV then Echo: for injecting test audio into a call. ------
; Transfer a channel here via AMI Redirect after setting PLAYFILE channel var.
; After playback finishes, the call continues in Echo() so it stays up.
exten => playfile,1,Answer()
 same => n,Playback(${PLAYFILE})
 same => n,Echo()
 same => n,Hangup()
exten => 606,1,Goto(test,playfile,1)
